global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: dispute-triage

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: dispute-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Workers are scaled with `docker compose up --scale worker=N --no-recreate`.
  # Docker's DNS returns one A record per container, so dns_sd scrapes all of
  # them without publishing 9100 on the host.
  - job_name: dispute-worker
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100
        refresh_interval: 30s
